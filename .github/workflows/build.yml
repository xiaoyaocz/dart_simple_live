name: Build Simple Live Dev Release APK

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: simple_live_app

    steps:
      # 1. 直接检出原作者 dev 分支
      - name: Checkout upstream dev
        uses: actions/checkout@v4
        with:
          repository: xiaoyaocz/dart_simple_live
          ref: dev

      # 2. 设置 Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. 设置 Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;28.2.13676358

      # 4. 根据项目 .fvmrc 自动设置 Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      # 5. 获取依赖
      - name: Get dependencies
        run: flutter pub get

      # 6. 解码签名文件
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # 7. 创建签名配置
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > android/key.properties

      # 8. 编译 Release APK
      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      # 9. 上传 APK
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-dev-1.11.7-apks
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          compression-level: 6
