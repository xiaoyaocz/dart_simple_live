name: app-build-ios-manual

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build iOS unsigned IPA on GitHub Actions"
        type: boolean
        default: true
      ref:
        description: "Git ref to build, for example master or v1.12.0"
        required: false
        default: "master"
      upload_release:
        description: "Upload build outputs to the matching GitHub Release when ref is a tag"
        required: false
        default: false
        type: boolean
      build_note:
        description: "6.1 quota strategy: use GitHub Actions only for macOS/iOS; build Android/Windows/Linux/TV locally"
        required: false
        default: "iOS only"
      version_suffix:
        description: "App version suffix for test identification, e.g. -hwA1; empty keeps pubspec version"
        required: false
        default: ""

jobs:
  build-ios:
    if: ${{ inputs.build_ios == true }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          cache: true

      - name: Print build strategy
        run: |
          echo "GitHub Actions quota strategy: macOS/iOS only. Android, Windows, Linux and Android TV are built locally."
          echo "Build note: ${{ inputs.build_note }}"

      - name: Restore Packages
        run: |
          cd simple_live_app
          flutter pub get

      - name: Resolve ref info
        id: ref_info
        shell: bash
        run: |
          ref_name="${{ inputs.ref }}"
          if [[ "$ref_name" == refs/tags/* ]]; then
            ref_name="${ref_name#refs/tags/}"
          fi
          is_tag="false"
          if [[ "$ref_name" == v* ]]; then
            is_tag="true"
          fi
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"

      - name: Resolve build name
        id: build_name
        shell: bash
        run: |
          cd simple_live_app
          suffix="${{ inputs.version_suffix }}"
          # 后缀注入 Dart 常量（lib/app/build_tag.dart），日志导出的
          # App Version 直接携带。不使用 --build-name：Xcode 会清洗
          # 版本串中的 + 和 -，导致后缀变形（实测 1.13.3+11303-S1 变成
          # 1.13.3113031+11303）。
          cat > lib/app/build_tag.dart <<EOF
          /// CI 构建时注入的测试包标识（如 "-S1"、"-R1"），本地构建为空字符串。
          const String kBuildTag = "$suffix";
          EOF
          echo "App build tag: $suffix"

      - name: Build iOS
        run: |
          cd simple_live_app
          flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd simple_live_app
          mkdir -p build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/Runner.app
          cd build/ios/iphoneos/
          zip -q -r ios_no_sign.ipa Payload

      - name: Upload IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      - name: Upload Release
        if: ${{ inputs.upload_release && steps.ref_info.outputs.is_tag == 'true' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.ref_info.outputs.ref_name }}
          name: ${{ steps.ref_info.outputs.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ref_info.outputs.ref_name, 'beta') || contains(steps.ref_info.outputs.ref_name, 'alpha') || contains(steps.ref_info.outputs.ref_name, 'pre') || contains(steps.ref_info.outputs.ref_name, 'next') || contains(steps.ref_info.outputs.ref_name, 'local') }}
          token: ${{ github.token }}
          fail_on_unmatched_files: false
          files: simple_live_app/build/ios/iphoneos/ios_no_sign.ipa

      - run: echo "iOS manual job status is ${{ job.status }}."
