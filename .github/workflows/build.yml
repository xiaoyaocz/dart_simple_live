name: Build Simple Live Dev Release APK

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: simple_live_app

    steps:
      # =================================
      # 1. Checkout upstream dev
      # =================================
      - name: Checkout upstream dev
        uses: actions/checkout@v4
        with:
          repository: xiaoyaocz/dart_simple_live
          ref: dev

      # =================================
      # 2. Set up Java 17
      # =================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =================================
      # 3. Setup Gradle cache
      # =================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =================================
      # 4. Setup Android SDK
      # =================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0
            ndk;28.2.13676358

      # =================================
      # 5. Set up Flutter
      # =================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      # =================================
      # 6. Get dependencies
      # =================================
      - name: Get dependencies
        run: flutter pub get

      # =================================
      # 7. Decode keystore
      # =================================
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # =================================
      # 8. Create key.properties
      # =================================
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.keystore"
          } > android/key.properties

      # =================================
      # 9. Build Release APK with retry
      # =================================
      - name: Build Release APK
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt: $attempt / 4"

            if flutter build apk --release --split-per-abi; then
              echo "Build successful!"
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              WAIT=$((30 * attempt))
              echo "Build failed. Retrying in ${WAIT} seconds..."
              sleep "$WAIT"
            fi
          done

          echo "Build failed after 4 attempts."
          exit 1

      # =================================
      # 10. Upload APKs
      # =================================
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-dev-release-apks
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          compression-level: 6
